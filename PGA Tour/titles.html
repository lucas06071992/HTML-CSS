<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-Time Titles - PGA TOUR</title>
    <style>
        :root { 
            --pga-green: #006633; 
            --pga-navy: #002d62; 
            --pga-gold: #c5a059; 
        }
        body { 
            font-family: "Montserrat", sans-serif; 
            margin: 0; 
            background: #f8f9fa; 
            color: #333; 
        }

        /* ==================== NAVBAR ==================== */
        nav {
            background: #ffffff;
            padding: 02px 06px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .nav-left { flex: 1; }
        .nav-logo { max-height: 50px; width: auto; }

        .nav-center { flex: 2; display: flex; justify-content: center; }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-links a {
            color: rgb(2, 2, 2);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover { color: var(--pga-gold); }

        .nav-right {
            flex: 1;
            text-align: right;
            padding-right: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-end;
        }

        .login-link {
            background: var(--pga-navy);
            color: white;
            padding: 8px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-btn {
            background: var(--pga-green);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        /* ==================== CONTEÚDO ==================== */
        .container { 
            max-width: 1200px; 
            margin: 25px auto; 
            padding: 25px; 
            background: white; 
            border-radius: 10px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); 
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        th { 
            background: var(--pga-navy); 
            color: white; 
            padding: 14px; 
            text-align: left; 
        }
        td { 
            padding: 14px; 
            border-bottom: 1px solid #eee; 
        }
        tr:hover { background: #f0f7ff; }

        .player-name { font-weight: bold; font-size: 1.05rem; }
        .player-info { font-size: 0.9rem; color: #555; }

        select.country-select {
            width: 100%;
            padding: 8px 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
            background: white;
        }

        .btn-add {
            background: var(--pga-green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }

        .btn-del {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* LOGIN MODAL */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
            z-index: 2000; 
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        .login-box h2 { margin-bottom: 25px; color: var(--pga-navy); }
        .login-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        .login-btn {
            background: var(--pga-green);
            color: white;
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ==================== NAVBAR ==================== -->
    <nav>
        <div class="nav-left">
            <img id="pgaLogo" src="./images/PGA_Tour_logo.svg.png" 
                 alt="PGA TOUR" 
                 class="nav-logo">
        </div>

        <div class="nav-center">
            <div class="nav-links">
                <a href="standings.html">STANDINGS</a>
                <a href="news.html">NEWS</a>
                <a href="schedule.html">SCHEDULE</a>
                <a href="archives.html">ARCHIVES</a>
                <a href="titles.html">ALL-TIME TITLES</a>
                <a href="current-tournament.html">CURRENT TOURNAMENT</a>
            </div>
        </div>

        <div class="nav-right">
            <span id="loginLink" class="login-link" onclick="openLoginModal()">Login</span>
            <button id="logoutBtn" class="admin-btn" onclick="logout()" style="display:none;">Sair (Admin)</button>
        </div>
    </nav>

    <div class="container">
        <h2 contenteditable="true">Career Major Records</h2>
        <table>
            <thead>
                <tr>
                    <th>Jogador</th>
                    <th>Masters</th>
                    <th>US Open</th>
                    <th>The Open</th>
                    <th>PGA Championship</th>
                    <th>Total</th>
                    <th>Wins</th>
                    <th class="admin-only" style="display:none;">Ação</th>
                </tr>
            </thead>
            <tbody id="titlesBody"></tbody>
        </table>
        <button class="btn-add admin-only" onclick="addPlayer()" style="display:none;">+ Adicionar Jogador</button>
    </div>

    <!-- LOGIN MODAL -->
    <div id="loginModal" class="modal">
        <div class="login-box">
            <h2>🔑 Acesso Administrativo</h2>
            <input type="text" id="username" class="login-input" placeholder="Usuário" autocomplete="off">
            <input type="password" id="password" class="login-input" placeholder="Senha" autocomplete="off">
            <button class="login-btn" onclick="login()">Entrar como Administrador</button>
            <p style="margin-top:15px; color:#666; font-size:0.9rem;">
                Usuário: <strong>ADMIN</strong><br>
                Senha: <strong>ADMIN</strong>
            </p>
        </div>
    </div>

    <script>
        let isEditMode = false;
        let isLoggedIn = false;
        
        let titles = JSON.parse(localStorage.getItem('pga_titles')) || [
            {name: "Jack Nicklaus", country: "🇺🇸 EUA", career: "1962–2005", masters: "6", usopen: "4", open: "3", pga: "5", total: "18", wins: "117"},
            {name: "Tiger Woods", country: "🇺🇸 EUA", career: "1996–presente", masters: "5", usopen: "3", open: "3", pga: "4", total: "15", wins: "110"},
            {name: "Walter Hagen", country: "🇺🇸 EUA", career: "1914–1936", masters: "0", usopen: "2", open: "4", pga: "5", total: "11", wins: "58"}
        ];

        const countries = [
            "🇺🇸 EUA", "🇬🇧 Reino Unido", "🏴󠁧󠁢󠁥󠁮󠁧󠁿 Inglaterra", "🏴󠁧󠁢󠁳󠁣󠁴󠁿 Escócia",
            "🏴󠁧󠁢󠁷󠁬󠁳󠁿 País de Gales", "🇮🇪 Irlanda", "🇮🇪 Irlanda do Norte",
            "🇿🇦 África do Sul", "🇦🇺 Austrália", "🇳🇿 Nova Zelândia", "🇨🇦 Canadá",
            "🇪🇸 Espanha", "🇸🇪 Suécia", "🇳🇴 Noruega", "🇩🇰 Dinamarca", "🇫🇮 Finlândia",
            "🇩🇪 Alemanha", "🇫🇷 França", "🇮🇹 Itália", "🇳🇱 Países Baixos", "🇧🇪 Bélgica",
            "🇨🇭 Suíça", "🇦🇹 Áustria", "🇵🇹 Portugal", "🇷🇺 Rússia", "🇯🇵 Japão",
            "🇰🇷 Coreia do Sul", "🇹🇭 Tailândia", "🇮🇳 Índia", "🇨🇳 China", "🇹🇼 Taiwan",
            "🇧🇷 Brasil", "🇦🇷 Argentina", "🇨🇱 Chile", "🇲🇽 México", "🇨🇴 Colômbia",
            "🇵🇪 Peru", "🇻🇪 Venezuela", "🇵🇾 Paraguai", "🇺🇾 Uruguai",
            "🇿🇼 Zimbabwe", "🇳🇬 Nigéria", "🇰🇪 Quênia", "🇪🇬 Egito",
            "🇫🇯 Fiji", "🇵🇬 Papua Nova Guiné", "🇸🇬 Singapura", "🇲🇾 Malásia",
            "🇵🇭 Filipinas", "🇮🇩 Indonésia", "🇻🇳 Vietnã", "🇰🇿 Cazaquistão",
            "🇺🇦 Ucrânia", "🇵🇱 Polônia", "🇨🇿 República Tcheca", "🇭🇺 Hungria",
            "🇬🇷 Grécia", "🇹🇷 Turquia", "🇮🇱 Israel", "🇸🇦 Arábia Saudita",
            "🇦🇪 Emirados Árabes Unidos", "🇶🇦 Catar", "🇮🇷 Irã", "🇲🇦 Marrocos",
            "🇩🇿 Argélia", "🇹🇳 Tunísia"
        ].sort();

        function openLoginModal() {
            document.getElementById('loginModal').style.display = 'flex';
        }

        function login() {
            const username = document.getElementById('username').value.trim().toUpperCase();
            const password = document.getElementById('password').value.trim().toUpperCase();

            if (username === "ADMIN" && password === "ADMIN") {
                isLoggedIn = true;
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('loginLink').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
                
                enableFullEditMode();
            } else {
                alert("❌ Usuário ou senha incorretos!\n\nUse:\nUsuário: ADMIN\nSenha: ADMIN");
            }
        }

        function enableFullEditMode() {
            isEditMode = true;
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
            renderTitles();
            alert("✅ Modo Editor Completo ativado!\nVocê agora pode editar os títulos de carreira.");
        }

        function logout() {
            if (confirm("Deseja sair do modo administrador?")) {
                isLoggedIn = false;
                isEditMode = false;
                document.getElementById('loginLink').style.display = 'inline-block';
                document.getElementById('logoutBtn').style.display = 'none';
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
                renderTitles();
            }
        }

        function renderTitles() {
            const tbody = document.getElementById('titlesBody');
            tbody.innerHTML = titles.map((t, i) => `
                <tr>
                    <td>
                        <span contenteditable="${isEditMode}" class="player-name" onblur="titles[${i}].name=this.innerText">${t.name}</span><br>
                        
                        ${isEditMode ? `
                        <select class="country-select" onchange="titles[${i}].country=this.value">
                            ${countries.map(c => `
                                <option value="${c}" ${c === t.country ? 'selected' : ''}>${c}</option>
                            `).join('')}
                        </select>` : `
                        <span class="player-info">${t.country}</span>`}
                        
                        • 
                        <span contenteditable="${isEditMode}" class="player-info" onblur="titles[${i}].career=this.innerText">${t.career}</span>
                    </td>
                    <td contenteditable="${isEditMode}" onblur="titles[${i}].masters=this.innerText">${t.masters}</td>
                    <td contenteditable="${isEditMode}" onblur="titles[${i}].usopen=this.innerText">${t.usopen}</td>
                    <td contenteditable="${isEditMode}" onblur="titles[${i}].open=this.innerText">${t.open}</td>
                    <td contenteditable="${isEditMode}" onblur="titles[${i}].pga=this.innerText">${t.pga}</td>
                    <td contenteditable="${isEditMode}" onblur="titles[${i}].total=this.innerText"><strong>${t.total}</strong></td>
                    <td contenteditable="${isEditMode}" onblur="titles[${i}].wins=this.innerText"><strong>${t.wins}</strong></td>
                    ${isEditMode ? `<td class="admin-only"><button class="btn-del" onclick="removePlayer(${i})">X</button></td>` : ''}
                </tr>
            `).join('');
        }

        function addPlayer() {
            titles.push({
                name: "Novo Jogador",
                country: "🇺🇸 EUA",
                career: "Ano–Ano",
                masters: "0",
                usopen: "0",
                open: "0",
                pga: "0",
                total: "0",
                wins: "0"
            });
            renderTitles();
        }

        function removePlayer(i) {
            if (confirm("Excluir este jogador?")) {
                titles.splice(i, 1);
                renderTitles();
            }
        }

        function saveData() {
            localStorage.setItem('pga_titles', JSON.stringify(titles));
            alert("✅ Dados salvos com sucesso!");
        }

        // Inicializar
        renderTitles();
    </script>
</body>
</html>
