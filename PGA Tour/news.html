<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - PGA TOUR</title>
    <style>
        :root { 
            --pga-green: #006633; 
            --pga-navy: #002d62; 
            --pga-gold: #c5a059; 
        }

        body { 
            font-family: "Montserrat", sans-serif; 
            margin: 0; 
            background: #f8f9fa; 
            color: #333; 
        }

        /* ==================== NAVBAR ==================== */
        nav {
            background: #ffffff;
            padding: 02px 06px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .nav-left { flex: 1; }
        .nav-logo { max-height: 50px; width: auto; }
        .nav-center { flex: 2; display: flex; justify-content: center; }
        .nav-links { display: flex; align-items: center; gap: 28px; }
        .nav-links a {
            color: #111;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: color 0.3s;
            letter-spacing: 0.5px;
        }
        .nav-links a:hover { color: var(--pga-gold); }

        .nav-right {
            flex: 1;
            text-align: right;
            padding-right: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-end;
        }

        .login-link {
            background: var(--pga-navy);
            color: white;
            padding: 8px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-btn {
            background: var(--pga-green);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        /* ==================== CONTAINER & GRID ==================== */
        .container { 
            max-width: 1200px; 
            margin: 40px auto; 
            padding: 0 20px; 
        }

        h2 { 
            font-size: 2rem; 
            margin-bottom: 30px; 
            border-left: 5px solid var(--pga-navy); 
            padding-left: 15px;
        }

        .news-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            gap: 30px; 
        }

        .news-card { 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            cursor: pointer; 
            transition: transform 0.3s, box-shadow 0.3s; 
        }

        .news-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
        }

        .news-img { 
            width: 100%; 
            height: 220px; 
            object-fit: cover; 
        }

        /* ==================== ÁREA DE ADMIN ==================== */
        .admin-only { 
            display: none; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            margin-bottom: 40px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #eee;
        }

        .admin-only.show {
            display: block;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-only input, .admin-only textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .file-input-wrapper {
            margin-bottom: 15px;
        }
        .file-input-wrapper label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #555;
        }

        .admin-only button {
            background: var(--pga-navy);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-only button:hover { background: #001d42; }

        /* LOGIN MODAL */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
            z-index: 2000; 
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        .login-box h2 { margin-bottom: 25px; color: var(--pga-navy); }
        .login-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        .login-btn {
            background: var(--pga-green);
            color: white;
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ==================== NAVBAR ==================== -->
    <nav>
        <div class="nav-left">
            <img id="pgaLogo" src="./images/PGA_Tour_logo.svg.png" alt="PGA TOUR" class="nav-logo">
        </div>
        <div class="nav-center">
            <div class="nav-links">
                <a href="standings.html">STANDINGS</a>
                <a href="news.html">NEWS</a>
                <a href="schedule.html">SCHEDULE</a>
                <a href="archives.html">ARCHIVES</a>
                <a href="titles.html">ALL-TIME TITLES</a>
                <a href="current-tournament.html">CURRENT TOURNAMENT</a>
            </div>
        </div>
        <div class="nav-right">
            <span id="loginLink" class="login-link" onclick="openLoginModal()">Login</span>
            <button id="logoutBtn" class="admin-btn" onclick="logout()" style="display:none;">Sair (Admin)</button>
        </div>
    </nav>

    <div class="container">
        <h2>Latest Headlines</h2>
        
        <div class="admin-only" id="adminPanel">
            <h3 style="margin-top:0; color: var(--pga-navy);">✨ Criar Nova Notícia</h3>
            <input type="text" id="newTitle" placeholder="Título da notícia principal">
            <input type="text" id="newSubtitle" placeholder="Subtítulo ou resumo">
            
            <div class="file-input-wrapper">
                <label for="newImage">🖼️ Selecionar Imagem (Local):</label>
                <input type="file" id="newImage" accept="image/*">
            </div>

            <textarea id="newContent" placeholder="Conteúdo completo da matéria..." style="height: 120px;"></textarea>
            <button onclick="addNews()">+ Postar no Feed</button>
        </div>

        <div class="news-grid" id="newsGrid"></div>
    </div>

    <!-- LOGIN MODAL -->
    <div id="loginModal" class="modal">
        <div class="login-box">
            <h2>🔑 Acesso Administrativo</h2>
            <input type="text" id="username" class="login-input" placeholder="Usuário" autocomplete="off">
            <input type="password" id="password" class="login-input" placeholder="Senha" autocomplete="off">
            <button class="login-btn" onclick="login()">Entrar como Administrador</button>
            <p style="margin-top:15px; color:#666; font-size:0.9rem;">
                Usuário: <strong>ADMIN</strong><br>
                Senha: <strong>ADMIN</strong>
            </p>
        </div>
    </div>

    <script>
        let isEditMode = false;
        let isLoggedIn = false;
        let news = JSON.parse(localStorage.getItem('pga_news')) || [];

        if (news.length === 0) {
            news = [
                {
                    id: 1,
                    title: "Scottie Scheffler domina The Players Championship",
                    subtitle: "Maior vitória do ano até agora",
                    content: "Scottie Scheffler mostrou mais uma vez porque é o número 1 do mundo...",
                    img: "https://picsum.photos/id/1015/1200/800"
                }
            ];
            localStorage.setItem('pga_news', JSON.stringify(news));
        }

        function openLoginModal() {
            document.getElementById('loginModal').style.display = 'flex';
        }

        function login() {
            const username = document.getElementById('username').value.trim().toUpperCase();
            const password = document.getElementById('password').value.trim().toUpperCase();

            if (username === "ADMIN" && password === "ADMIN") {
                isLoggedIn = true;
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('loginLink').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
                
                enableFullEditMode();
            } else {
                alert("❌ Usuário ou senha incorretos!\n\nUse:\nUsuário: ADMIN\nSenha: ADMIN");
            }
        }

        function enableFullEditMode() {
            isEditMode = true;
            document.getElementById('adminPanel').classList.add('show');
            renderNews();
            alert("✅ Modo Editor Completo ativado!\nVocê agora pode criar e gerenciar notícias.");
        }

        function logout() {
            if (confirm("Deseja sair do modo administrador?")) {
                isLoggedIn = false;
                isEditMode = false;
                document.getElementById('loginLink').style.display = 'inline-block';
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('adminPanel').classList.remove('show');
                renderNews();
            }
        }

        function renderNews() {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = news.map(n => `
                <div class="news-card" onclick="openNews(${n.id})">
                    <img src="${n.img}" class="news-img" alt="Imagem da notícia">
                    <div style="padding:20px;">
                        <h3 style="margin:0 0 10px 0; font-size:1.2rem; color:#111;">${n.title}</h3>
                        ${n.subtitle ? `<p style="color:#666; font-size:0.9rem; line-height:1.4;">${n.subtitle}</p>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function openNews(id) {
            if (!isEditMode) {
                window.location.href = `news-detail.html?id=${id}`;
            } else {
                alert("Modo Edição Ativo.\nPara visualizar como usuário normal, saia do modo administrador.");
            }
        }

        function addNews() {
            const titleInput = document.getElementById('newTitle');
            const subtitleInput = document.getElementById('newSubtitle');
            const contentInput = document.getElementById('newContent');
            const imageInput = document.getElementById('newImage');

            if (!titleInput.value.trim()) {
                alert("Por favor, insira ao menos um título.");
                return;
            }

            const file = imageInput.files[0];
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processNewEntry(titleInput.value, subtitleInput.value, contentInput.value, e.target.result);
                };
                reader.readAsDataURL(file);
            } else {
                const fallbackImg = "https://picsum.photos/id/" + Math.floor(Math.random() * 1000) + "/1200/800";
                processNewEntry(titleInput.value, subtitleInput.value, contentInput.value, fallbackImg);
            }
        }

        function processNewEntry(title, subtitle, content, imgSrc) {
            const newEntry = {
                id: Date.now(),
                title: title.trim(),
                subtitle: subtitle.trim(),
                content: content.trim() || "Conteúdo da notícia...",
                img: imgSrc
            };

            news.unshift(newEntry);
            
            document.getElementById('newTitle').value = '';
            document.getElementById('newSubtitle').value = '';
            document.getElementById('newContent').value = '';
            document.getElementById('newImage').value = '';

            renderNews();
        }

        function saveData() {
            try {
                localStorage.setItem('pga_news', JSON.stringify(news));
                alert("✅ Alterações salvas com sucesso!");
            } catch (e) {
                alert("⚠️ Erro ao salvar: O arquivo de imagem pode ser muito grande.");
                console.error(e);
            }
        }

        // Inicialização
        renderNews();
    </script>
</body>
</html>
